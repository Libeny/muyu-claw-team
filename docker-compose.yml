services:
  postgres:
    image: postgres:16
    container_name: muyu-claw-team-postgres
    environment:
      POSTGRES_DB: muyu_claw_team
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./var/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: muyu-claw-team-redis
    ports:
      - "6379:6379"
    volumes:
      - ./var/data/redis:/data
